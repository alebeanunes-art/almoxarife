<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almoxarifado SENAI - Movimentações</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/movimentacoes.css') }}">
</head>
<body>

  <header class="topbar">
    <img src="{{ url_for('static', filename='fotos/senai_logo.png') }}" alt="Logo SENAI" class="topbar-logo">
    <h2>Sistema de Gestão de Almoxarifado</h2>
    <a href="/login" class="btn-logout-top">SAIR</a>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <nav>
        <a href="/home" class="nav-btn">Home</a>
        <a href="/movimentacoes" class="nav-btn active">Movimentações</a>
        <a href="/estoque" class="nav-btn">Estoque</a>
        <a href="/add-usuario" class="nav-btn">Usuários</a>
      </nav>
    </aside>

    <main class="content">
      <h1>Movimentações do Estoque</h1>

      <section class="card-tabela">
        <h3>Histórico Recente</h3>

        <input type="text" placeholder="Pesquisar movimentação..." class="input-busca">

        <table>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Item</th>
              <th>Tipo</th>
              <th>Qtd</th>
              <th>Utilizador</th>
              <th>Data e Hora</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><img src="" alt="Item" class="img-produto"></td>
              <td></td>
              <td><span class="badge entrada"></span></td>
              <td></td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

</body>
</html>
