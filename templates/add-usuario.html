<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Usuário - Sistema de Estoque</title>
</head>

<body>

    <header>
        <h1>Sistema de Estoque</h1>

        <nav aria-label="Navegação principal">
            <ul>
                <li>
                    <a href="home.html">Início</a>
                </li>

                <li>
                    <a href="movimentacoes.html">Movimentações</a>
                </li>

                <li>
                    <a href="estoque.html">Estoque</a>
                </li>

                <li>
                    <a href="add-usuario.html">Adicionar usuário</a>
                </li>

                <li>
                    <a href="login.html">Sair</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <section aria-labelledby="titulo-usuario">
            <h2 id="titulo-usuario">Adicionar usuário</h2>

            <form action="/usuarios" method="POST">

                <div>
                    <label for="nome">Nome:</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >
                </div>

                <div>
                    <label for="usuario">Usuário:</label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        required
                    >
                </div>

                <div>
                    <label for="senha">Senha:</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        required
                    >
                </div>

                <div>
                    <label for="tipo">Tipo de usuário:</label>

                    <select id="tipo" name="tipo" required>
                        <option value="usuario">Usuário</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>

                <button type="submit">
                    Cadastrar usuário
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>Sistema de Estoque</p>
    </footer>

</body>
</html>
