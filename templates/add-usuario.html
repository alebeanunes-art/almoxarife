<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Usuário - Almoxarifado SENAI</title>
  <!-- Importa a folha de estilos CSS específica para esta página -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/add-usuario.css') }}">
</head>
<body>

  <!-- Cabeçalho superior da aplicação -->
  <header class="topbar">
    <img src="{{ url_for('static', filename='fotos/senai_logo.png') }}" alt="Logo SENAI" class="topbar-logo">
    <h2>Sistema de Gestão de Almoxarifado</h2>
    <a href="/login" class="btn-logout-top">SAIR</a>
  </header>

  <!-- Contentor principal que divide a tela entre o menu lateral e o conteúdo -->
  <div class="main-container">
    
    <!-- Barra lateral de navegação (Sidebar) -->
    <aside class="sidebar">
      <nav>
        <a href="/home" class="nav-btn">Home</a>
        <a href="/movimentacoes" class="nav-btn">Movimentações</a>
        
        <!-- Condicional Flask: Mostra o botão de gestão de utilizadores apenas se o utilizador logado for 'admin' -->
        {% if session.get('role') == 'admin' %}
          <a href="/add-usuario" class="nav-btn">Usuários</a>
        {% endif %}
      </nav>
    </aside>

    <!-- Secção principal de conteúdo da página -->
    <main class="content">
      <h1>Cadastrar Novo Usuário</h1>

      <!-- Cartão / Caixa do formulário de cadastro -->
      <section class="card-form">
        
        <!-- Mensagem de sucesso (aparece a verde caso exista na resposta do Flask) -->
        {% if mensagem %}
          <p style="color: #137333; margin-bottom: 12px; font-size: 14px;">{{ mensagem }}</p>
        {% endif %}
        
        <!-- Mensagem de erro (aparece a vermelho caso exista algum problema ou utilizador duplicado) -->
        {% if erro %}
          <p style="color: #c5221f; margin-bottom: 12px; font-size: 14px;">{{ erro }}</p>
        {% endif %}

        <!-- Formulário de cadastro enviado via POST para a rota /add-usuario -->
        <form action="/add-usuario" method="POST">
          
          <!-- Campo para inserção do nome de utilizador -->
          <div class="form-group">
            <label for="username">Nome de Usuário</label>
            <input type="text" id="username" name="username" required placeholder="Digite o usuário">
          </div>

          <!-- Campo para inserção da senha -->
          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required placeholder="Digite a senha">
          </div>

          <!-- Seletor do nível de permissão (Perfil) do novo utilizador -->
          <div class="form-group">
            <label for="role">Tipo de Usuário</label>
            <select id="role" name="role" required class="input-select">
              <option value="usuario">Usuário</option>
              <option value="admin">Administrador</option>
            </select>
          </div>

          <!-- Botão de submissão do formulário -->
          <button type="submit" class="btn-salvar">Cadastrar</button>
        </form>
      </section>
    </main>
  </div>

</body>
</html>
