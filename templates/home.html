<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almoxarifado SENAI - Home</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>

  <header class="topbar">
    <img src="{{ url_for('static', filename='fotos/senai_logo.png') }}" alt="Logo SENAI" class="topbar-logo">
    <h2>Sistema de Gestão de Almoxarifado</h2>
    <a href="/login" class="btn-logout-top">SAIR</a>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <nav>
        <a href="/home" class="nav-btn active">Home</a>
        <a href="/movimentacoes" class="nav-btn">Movimentações</a>
        <a href="/estoque" class="nav-btn">Estoque</a>
        <a href="/relatorios" class="nav-btn">Relatórios</a>
      </nav>
    </aside>

    <main class="content">
      <h1>Painel Geral de Estoque</h1>

      <section class="card-tabela">
        <header class="card-header">
          <h3>Produtos em Estoque</h3>
          <input type="text" placeholder="Pesquisar produto..." class="input-busca">
          <button type="button" class="btn-add" onclick="abrirModal('modal-add')">+</button>
        </header>

        <table>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Código</th>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Qtd</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><img src="https://via.placeholder.com/40" alt="Item" class="img-produto"></td>
              <td>#001</td>
              <td>Chave de Fenda 1/4</td>
              <td>Ferramentas</td>
              <td>15</td>
              <td><span class="status ok">Disponível</span></td>
              <td><button type="button" class="btn-editar" onclick="abrirModal('modal-editar')">Editar</button></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- MODAL: ADICIONAR PRODUTO -->
  <div id="modal-add" class="modal">
    <form action="/api/produtos" method="POST" class="modal-conteudo">
      <header class="modal-header">
        <h3>Adicionar Produto</h3>
        <span class="btn-fechar" onclick="fecharModal('modal-add')">&times;</span>
      </header>

      <label>Nome</label>
      <input type="text" name="nome" required placeholder="Nome do produto">

      <label>Quantidade</label>
      <input type="number" name="quantidade" min="0" required placeholder="0">

      <label>Categoria</label>
      <input type="text" name="categoria" required placeholder="Categoria">

      <label>Foto (Link)</label>
      <input type="url" name="foto" placeholder="https://link.com/foto.jpg">

      <button type="submit" class="btn-salvar">Salvar</button>
    </form>
  </div>

  <!-- MODAL: EDITAR PRODUTO -->
  <div id="modal-editar" class="modal">
    <form action="/api/produtos/editar" method="POST" class="modal-conteudo">
      <header class="modal-header">
        <h3>Editar Produto</h3>
        <span class="btn-fechar" onclick="fecharModal('modal-editar')">&times;</span>
      </header>

      <label>Nome</label>
      <input type="text" name="nome" value="Chave de Fenda 1/4">

      <label>Quantidade</label>
      <input type="number" name="quantidade" value="15">

      <label>Categoria</label>
      <input type="text" name="categoria" value="Ferramentas">

      <label>Foto (Link)</label>
      <input type="url" name="foto" value="https://via.placeholder.com/40">

      <button type="submit" class="btn-salvar">Atualizar</button>
    </form>
  </div>

  <script>
    function abrirModal(id) { document.getElementById(id).style.display = 'flex'; }
    function fecharModal(id) { document.getElementById(id).style.display = 'none'; }
  </script>

</body>
</html>
