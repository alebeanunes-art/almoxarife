<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almoxarifado SENAI - Home</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>

  <!-- BARRA SUPERIOR (TOPBAR) -->
 <header class="topbar">
  <div class="topbar-logo">
    <img src="{{ url_for('static', filename='fotos/senai_logo.png') }}" alt="Logo SENAI">
  </div>
  <div class="topbar-titulo">
    <h2>Sistema de Gestão de Almoxarifado</h2>
  </div>
  <a href="/login" class="btn-logout-top">SAIR</a>
</header>

  <!-- CONTAINER PRINCIPAL -->
  <div class="main-container">

    <!-- NAVBAR LATERAL -->
    <aside class="sidebar">
      <nav>
        <a href="/home" class="nav-btn active">Home</a>
        <a href="/movimentacoes" class="nav-btn">Movimentações</a>
        <a href="/estoque" class="nav-btn">Estoque</a>
        <a href="/relatorios" class="nav-btn">Relatórios</a>
      </nav>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="content">
      <h1>Painel Geral de Estoque</h1>

      <!-- CARD COM A TABELA DE PRODUTOS -->
      <section class="card-tabela">
        <h3>Produtos em Estoque</h3>
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Quantidade</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
           
          </tbody>
        </table>
      </section>
    </main>

  </div>

</body>
</html>
