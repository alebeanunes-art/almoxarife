<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimentações - Almoxarifado</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/movimentacoes.css') }}">
</head>
<body>

  <header>
    <h2>Sistema de Almoxarifado</h2>
    <a href="/login">Sair</a>
  </header>

  <nav>
    <ul>
      <li><a href="/home">Início</a></li>
      <li><a href="/movimentacoes">Movimentações</a></li>
      <li><a href="/estoque">Estoque</a></li>
      <li><a href="/add-usuario">Cadastrar Usuário</a></li>
    </ul>
  </nav>

  <main>
    <section>
      <h1>Registrar Movimentação</h1>

      <form action="/movimentacoes" method="POST">
        <div>
          <label for="tipo">Tipo de Movimentação</label>
          <select id="tipo" name="tipo" required>
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>
        </div>

        <div>
          <label for="produto">Produto</label>
          <input type="text" id="produto" name="produto" required>
        </div>

        <div>
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="1" required>
        </div>

        <button type="submit">Salvar Movimentação</button>
      </form>
    </section>
  </main>

<script src="{{ url_for('static', filename='js/movimentacoes.js') }}"></script>

</body>
</html>
